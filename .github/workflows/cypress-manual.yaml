name: Testes E2E Cypress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Instalar dependencias
        run: npm install

      - name: Executar testes Cypress
        run: npx cypress run

      - name: Salvar relatorios e evidencias
        uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: relatorio-cypress-mochawesome
          path: |
            cypress/relatorio/
            cypress/screenshots/
          if-no-files-found: warn
          retention-days: 14